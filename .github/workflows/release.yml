name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time, so two quick pushes can never claim the same version.
concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_NAME: TowerDuel
  # Releases are named v<VERSION_MAJOR>.<minor>. The minor is bumped automatically on
  # every push; raise the major here by hand to start a new series (v2.0, v2.1, ...).
  VERSION_MAJOR: 1
  KEY_ALIAS: towerduel

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Compute next version
        id: version
        run: |
          # Highest existing v<major>.<minor> tag on the remote, plus one (or .0 if there is none).
          last=$(git ls-remote --tags origin "v${VERSION_MAJOR}.*" \
            | sed -nE "s#.*refs/tags/v${VERSION_MAJOR}\.([0-9]+)\$#\1#p" | sort -n | tail -1)
          minor=$(( ${last:--1} + 1 ))
          echo "name=${VERSION_MAJOR}.${minor}" >> "$GITHUB_OUTPUT"
          echo "code=$(( VERSION_MAJOR * 10000 + minor ))" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION_MAJOR}.${minor}" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secrets KEYSTORE_BASE64 and KEYSTORE_PASSWORD must be set. See 'Release signing' in README.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PappVersionName="$VERSION_NAME" -PappVersionCode="$VERSION_CODE"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          apk="${APP_NAME}-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          # Fails instead of overwriting if the tag already has a release.
          gh release create "$TAG" "$apk" --title "${APP_NAME} ${TAG}" --target "$GITHUB_SHA" --generate-notes
